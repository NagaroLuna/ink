/* ---------- Captura rápida ---------- */
function openCapture(pid, chId, pre = {}) {
  const m = Store.meta();
  let proj = pid !== undefined ? pid : (m.lastProjectId && Store.get("projects", m.lastProjectId) ? m.lastProjectId : (Data.current()?.id || ""));
  let type = pre.type && TYPES[pre.type] ? pre.type : "chispa";
  let chars = new Set(pre.char ? [pre.char] : []);
  const draw = () => {
    const box = $(".modal"); if (!box) return;
    const p = proj && Store.get("projects", proj);
    box.dataset.genre = p ? p.genre : "tinta";
    box.querySelector("#cap-types").innerHTML = typeChips("cap-type", type);
    box.querySelector("#cap-projects").innerHTML = projectChips("cap-proj", proj);
    const cs = p ? Data.characters(p.id) : [];
    chars = new Set([...chars].filter((id) => cs.some((c) => c.id === id)));
    box.querySelector("#cap-chars").innerHTML = cs.length ? `<div class="lbl">¿De quién? (opcional)</div><div class="chips">${cs.map((c) => `<button type="button" class="chip char-chip" data-chip="cap-char" data-v="${c.id}" aria-pressed="${chars.has(c.id)}">${avatarHTML(c, 22)}${esc(c.name)}</button>`).join("")}</div>` : "";
  };
  openModal(`<h2>¿Qué se te ocurrió?</h2>
    <textarea class="cap" id="cap-text" spellcheck="true" lang="es" placeholder="Una frase, una escena, algo que diría un personaje…"></textarea>
    <div class="lbl">Es una</div><div id="cap-types"></div>
    <div class="lbl">Para el libro</div><div id="cap-projects"></div><div id="cap-chars"></div>
    <div class="foot"><span class="hint">Ctrl + Enter para guardar</span><span class="spacer"></span><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" id="cap-save">Guardar idea</button></div>`, (box) => {
    draw();
    const ta = box.querySelector("#cap-text"); setTimeout(() => ta.focus(), 30);
    box.addEventListener("click", (e) => {
      const b = e.target.closest("[data-chip]"); if (!b) return;
      if (b.dataset.chip === "cap-type") type = b.dataset.v; else if (b.dataset.chip === "cap-char") { chars.has(b.dataset.v) ? chars.delete(b.dataset.v) : chars.add(b.dataset.v); } else proj = b.dataset.v;
      draw();
    });
    const save = () => {
      const text = ta.value.trim(); if (!text) { ta.focus(); return; }
      const rec = Store.put("ideas", { id: newId(), text, type, projectId: proj || null, chapterId: chId && proj ? chId : null, characterIds: [...chars] });
      if (proj) { const p = Store.get("projects", proj); Store.put("projects", { ...p, touchedAt: Date.now() }, { quiet: true }); }
      Store.setMeta({ lastProjectId: proj || null }, { quiet: true });
      closeModal();
      const t = TYPES[type]; const p = proj && Store.get("projects", proj);
      toast(`${t.label} ${t.fem ? "guardada" : "guardado"} ${p ? `en «${p.title}»` : "en la Bandeja"}`, { glyph: t.g, action: "Desarrollar", onAction: () => (location.hash = "#/i/" + rec.id) });
      App.changed("ideas");
    };
    box.querySelector("#cap-save").onclick = save;
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });
  });
}

function newChapter(pid) {
  const p = Store.get("projects", pid); const cs = Data.chapters(pid);
  const c = Store.put("chapters", { id: newId(), projectId: pid, title: `${Data.unitName(p)} ${cs.length + 1}`, order: cs.length ? (cs[cs.length - 1].order ?? cs.length) + 1 : 0, status: "pendiente", text: "", words: 0 }, { quiet: true });
  location.hash = "#/c/" + c.id;
}

/* ---------- Portadas ---------- */
function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const maxH = 900, maxW = 600; let { width: w, height: h } = img;
      const k = Math.min(1, maxW / w, maxH / h); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.82, out = cv.toDataURL("image/jpeg", q);
      while (out.length > 170000 && q > 0.35) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

/* ---------- Respaldo ---------- */
async function exportBackup() {
  const data = JSON.stringify({ app: "INK", version: 1, exportedAt: new Date().toISOString(), ...Store.state }, null, 1);
  const filename = `INK-respaldo-${dayKey()}.json`; Store.setMeta({ lastBackup: Date.now() }, { quiet: true });
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { const r = await dl.save({ filename, data: new Blob([data], { type: "application/json" }) }); if (r && r.status === "saved") toast("Respaldo descargado", { glyph: "✓" }); }
    catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("No se pudo descargar el respaldo en esta vista."); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result); if (s.app !== "INK") throw 0;
      let n = 0;
      for (const c of COLLS) for (const [id, rec] of Object.entries(s[c] || {})) {
        const l = Store.state[c][id];
        if (!l || (rec.updatedAt || 0) > (l.updatedAt || 0)) { Store.state[c][id] = rec; Store.dirty.add(c + ":" + id); n++; }
      }
      if (s.meta && s.meta.stats) { const st = { ...(Store.meta().stats || {}) }; for (const [k, v] of Object.entries(s.meta.stats)) st[k] = Math.max(st[k] || 0, v); Store.setMeta({ stats: st }, { quiet: true }); }
      Store.persist(); Store.flushSoon(300); App.render();
      toast(n ? `Se restauraron ${n} elementos` : "Tu trabajo ya estaba al día", { glyph: "✓" });
    } catch (e) { toast("Ese archivo no es un respaldo de INK."); }
  };
  r.readAsText(file);
}

    const [a, b, c] = h;
    if (a === "p" && b) return { name: "project", args: [b, c || "capitulos"] };

  },
  shell() {
    const r = this.route.name; const inbox = Data.inbox().length;
    const cur = (n) => (r === n ? 'aria-current="page"' : "");
    const pid = r === "project" ? this.route.args[0] : null;

      <button class="fab" data-act="capture" aria-label="Anotar idea">${ico("plus")}</button>

      <a href="#/ajustes" ${cur("settings")}>${ico("gear")}Ajustes</a>`;
  },
  render() {
    this.pending = false;
    const ms = $("#ms"); if (ms && ms.dataset.id) this.saveChapterText(ms.dataset.id, ms.value, countWords(ms.value));
    const it = $("#idea-text"); if (it && it.dataset.id) { const i = Store.get("ideas", it.dataset.id); if (i && i.text !== it.value) Store.state.ideas[i.id] = { ...i, text: it.value, updatedAt: Date.now() }, Store.dirty.add("ideas:" + i.id), Store.persistSoon(), Store.flushSoon(); }
    const prev = this.route; this.route = this.parse();
    if (this.route.name !== "chapter" || prev.args[0] !== this.route.args[0]) Ed.on = false;
    if (prev.name === "chapter" && (this.route.name !== "chapter" || prev.args[0] !== this.route.args[0])) this.endSession();
    const v = Views[this.route.name](...this.route.args);
    document.body.dataset.genre = v.genre || "tinta";
    document.body.classList.toggle("writing", !!v.writing);
    this.shell();
    $("#view").innerHTML = v.html;
    if (prev.name !== this.route.name || prev.args.join() !== this.route.args.join()) window.scrollTo(0, 0);
    if (this.route.name === "chapter") this.mountRoom(this.route.args[0]);
    if (this.route.name === "idea") this.mountIdea();

    if (this.route.name === "avatar") mountAvatar();

  changed(coll, remote) {
    const a = document.activeElement;
    const typing = a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "file") || a.tagName === "SELECT") && $("#view").contains(a);
    if ($("#modal").innerHTML || typing || (this.route.name === "chapter" && remote)) {
      this.pending = true;
      if (this.route.name === "chapter") this.shellOnlyLater();
      return;
    }
    this.render();
  },
  shellOnlyLater() { /* la sala de escritura no se redibuja mientras escribes */ },

  /* ---------- Sala de escritura ---------- */
  mountRoom(id) {
    const c = Store.get("chapters", id); if (!c) return;
    if (Ed.on) { if (!this.session || this.session.id !== id) this.session = { id, startWords: c.words || 0, counted: c.words || 0, start: Date.now() }; Ed.mount(id); return; }
    const ta = $("#ms"); const wc = $("#wc");
    if (!this.session || this.session.id !== id) this.session = { id, startWords: c.words || 0, counted: c.words || 0, start: Date.now() };
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    const wc2 = $("#wc2"); const showWC = (w) => { const s = w - this.session.startWords; const t = `${fmt(w)} palabras${s > 0 ? `, +${fmt(s)} en esta sesión` : ""}`; wc.textContent = t; if (wc2) wc2.textContent = t; };
    fit(); showWC(c.words || 0);
    let t = 0;
    ta.addEventListener("input", () => {
      fit();
      const w = countWords(ta.value); showWC(w);
      clearTimeout(t);
      t = setTimeout(() => this.saveChapterText(id, ta.value, w), 700);
    });
    ta.addEventListener("blur", () => { clearTimeout(t); this.saveChapterText(id, ta.value, countWords(ta.value)); if (this.pending) setTimeout(() => { if (document.activeElement !== ta && !$("#modal").innerHTML) this.pending = false; }, 0); });
    if (!c.text) setTimeout(() => ta.focus(), 60);
    Cast.mount(id);
    window.addEventListener("resize", fit, { once: true });
  },
  saveChapterText(id, text, w) {
    const c = Store.get("chapters", id); if (!c || c.text === text) return;
    const s = this.session;
    if (s && s.id === id) { const delta = w - s.counted; if (delta > 0) Data.addWords(delta); s.counted = Math.max(s.counted, w); }
    const patch = { ...c, text, words: w, writtenAt: Date.now() };
    if ((c.status || "pendiente") === "pendiente" && w > 0) { patch.status = "borrador"; const sel = $('[data-act="ch-status"]'); if (sel) sel.value = "borrador"; }
    Store.put("chapters", patch, { quiet: true });
    const p = Store.get("projects", c.projectId); if (p) Store.put("projects", { ...p, touchedAt: Date.now() }, { quiet: true });
    if (text.length > 240000 && !this._longWarn) { this._longWarn = true; toast("Este capítulo es muy largo. Considera dividirlo para que sincronice sin problemas."); }
  },
  endSession() {
    const s = this.session; this.session = null; if (!s) return;
    const ta = $("#ms"); if (ta && ta.dataset.id === s.id) this.saveChapterText(s.id, ta.value, countWords(ta.value));
    const c = Store.get("chapters", s.id); if (!c) return;
    const gained = (c.words || 0) - s.startWords;
    if (gained >= 20) {
      const p = Store.get("projects", c.projectId);
      toast(`+${fmt(gained)} palabras`, { big: true, sub: `${pick(CHEERS)} «${p ? p.title : ""}» ya suma ${fmt(Data.words(c.projectId))} palabras.`, ms: 6500 });
    }
  },
  mountIdea() {
    const ta = $("#idea-text"); if (!ta) return;
    const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight, window.innerHeight * 0.4) + "px"; };
    fit(); let t = 0;
    ta.addEventListener("input", () => {
      fit(); clearTimeout(t);
      t = setTimeout(() => { const i = Store.get("ideas", ta.dataset.id); if (i && i.text !== ta.value) { Store.put("ideas", { ...i, text: ta.value }, { quiet: true }); const s = $("#idea-saved"); if (s) s.textContent = "Guardado"; } }, 600);
    });
    ta.addEventListener("blur", () => { clearTimeout(t); const i = Store.get("ideas", ta.dataset.id); if (i && i.text !== ta.value) Store.put("ideas", { ...i, text: ta.value }, { quiet: true }); if (this.pending) setTimeout(() => this.render(), 0); });
  },
};

/* ================= Eventos ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; const d = el.dataset;
  if (el.tagName === "SELECT" || el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
  switch (a) {
    case "capture": openCapture(d.p, d.ch, { char: d.char, type: d.type }); break;
    case "cast-mode": App.castMode = d.v; App.connectFrom = null; App.render(); break;
    case "new-char": newCharacter(d.p); break;
    case "bring-char": bringCharacter(d.p); break;
    case "connect-start": App.connectFrom = d.id; App.render(); break;
    case "connect-cancel": App.connectFrom = null; App.render(); break;
    case "new-rel": relModal({ from: d.id }); break;
    case "edit-rel": { const r = Store.get("relations", d.id); if (r) relModal({ rel: r, from: d.from || undefined }); break; }
    case "char-color": { const c = Store.get("characters", App.route.args[0]); if (c) { const n = Store.put("characters", { ...c, color: d.v }); if (n.avatar) Av.thumb(n).then((t) => { const cur = Store.get("characters", n.id); if (cur && t) Store.put("characters", { ...cur, thumb: t }); }).catch(() => {}); } break; }
    case "name-ideas": openNameGen((n) => { const c = Store.get("characters", App.route.args[0]); if (c) Store.put("characters", { ...c, name: n }); toast(`Ahora se llama ${n}`, { glyph: "✦" }); }); break;
    case "look-quick": { const c = JSON.parse(JSON.stringify(Store.get("characters", d.id))); c.avatar.active = d.v; Store.put("characters", c, { quiet: true }); Av.thumb(c).then((t) => { const cur = Store.get("characters", c.id); if (cur && t) Store.put("characters", { ...cur, thumb: t }); }).catch(() => App.render()); break; }
    case "del-char": deleteCharacter(d.id); break;
    case "sheet": openSheetDialog(d.id); break;
    case "review": Ed.enter(App.route.args[0]); break;
    case "book-export": openBookExport(d.p); break;
    case "sb-setup": openSBSetup(); break;
    case "sb-now": localStorage.removeItem("ink:sb:since"); Store.pullSB(); toast("Sincronizando…"); break;
    case "sb-out": confirmBox("¿Cerrar sesión de tu nube?", "Tus datos siguen en tu nube y en este dispositivo. Dejarán de sincronizarse aquí hasta que vuelvas a entrar.", "Cerrar sesión", () => { SB.setSess(null); Store.sb = false; Store.setStatus("local"); App.render(); }); break;
    case "backup-later": Store.setMeta({ backupSnooze: Date.now() }); break;
    case "keep-import": openKeepImport(); break;
    case "ib-tag": App.inboxF.tag = d.v; App.render(); break;
    case "ib-bulk-del": { const ids = [...App.inboxF.sel]; confirmBox(`¿Eliminar ${ids.length} ideas?`, "Se eliminarán en todos tus dispositivos.", "Eliminar", () => { ids.forEach((id) => Store.remove("ideas", id)); App.inboxF.sel.clear(); App.render(); toast(`${ids.length} ideas eliminadas`); }); break; }
    case "new-project": openNewProject(); break;
    case "new-chapter": newChapter(d.p); break;
    case "switch": Store.setMeta({ currentProjectId: d.p }); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "modal-close": closeModal(); break;
    case "modal-bg": if (e.target === el) closeModal(); break;
    case "idea-filter": App.ideaFilter.type = d.v; App.render(); break;
    case "move-ch": {
      const c = Store.get("chapters", d.id); const cs = Data.chapters(c.projectId); const i = cs.findIndex((x) => x.id === c.id); const j = i + Number(d.d);
      if (j < 0 || j >= cs.length) break;
      cs.forEach((x, k) => { if (x.order !== k) Store.put("chapters", { ...x, order: k }, { quiet: true }); });
      const A = Store.get("chapters", cs[i].id), B = Store.get("chapters", cs[j].id);
      Store.put("chapters", { ...A, order: j }, { quiet: true }); Store.put("chapters", { ...B, order: i });
      break;
    }
    case "del-idea": confirmBox("¿Eliminar esta idea?", "Se eliminará en todos tus dispositivos.", "Eliminar", () => { Store.remove("ideas", d.id); if (d.back) location.hash = d.back; toast("Idea eliminada"); }); break;
    case "del-chapter": {
      const c = Store.get("chapters", d.id);
      confirmBox(`¿Eliminar «${c.title}»?`, `Se perderán sus ${fmt(c.words)} palabras. Las ideas asignadas seguirán en el libro.`, "Eliminar", () => { App.session = null; Store.remove("chapters", d.id); Store.list("ideas").filter((i) => i.chapterId === d.id).forEach((i) => Store.put("ideas", { ...i, chapterId: null }, { quiet: true })); location.hash = "#/p/" + c.projectId; });
      break;
    }
    case "del-project": {
      const p = Store.get("projects", d.p);
      confirmBox(`¿Eliminar «${p.title}»?`, "Sus capítulos y personajes se eliminarán. Sus ideas pasarán a la Bandeja para que no se pierdan.", "Eliminar libro", () => {
        Data.chapters(p.id).forEach((c) => Store.remove("chapters", c.id));
        Store.list("relations").filter((r) => r.projectId === p.id).forEach((r) => Store.remove("relations", r.id));
        Data.characters(p.id).forEach((c) => Store.remove("characters", c.id));
        Store.list("ideas").filter((i) => i.projectId === p.id && (i.characterIds || []).length).forEach((i) => Store.put("ideas", { ...i, characterIds: [] }, { quiet: true }));
        Store.list("ideas").filter((i) => i.projectId === p.id).forEach((i) => Store.put("ideas", { ...i, projectId: null, chapterId: null }, { quiet: true }));
        Store.list("projects").filter((x) => x.parentId === p.id).forEach((x) => Store.put("projects", { ...x, parentId: null }, { quiet: true }));
        Store.remove("projects", p.id); location.hash = "#/libros";
      });
      break;
    }
    case "cover-rm": { const p = Store.get("projects", d.p); Store.put("projects", { ...p, cover: null }); break; }
    case "grow": {
      const it = $("#idea-text"); const i0 = Store.get("ideas", d.id); const i = { ...i0, text: it ? it.value : i0.text };
      Store.put("ideas", { ...i, type: "escena", origin: i.origin || { type: i.type, text: i.text, at: i.createdAt } });
      toast("Ahora es una escena. Su origen queda guardado.", { glyph: "¶" });
      break;
    }
    case "to-chapter": {
      const it = $("#idea-text"); const i0 = Store.get("ideas", d.id); const i = { ...i0, text: it ? it.value : i0.text }; const c = Store.get("chapters", i.chapterId);
      const text = (c.text || "").replace(/\s+$/, ""); const nt = (text ? text + "\n\n" : "") + (i.text || "").trim();
      const w = countWords(nt); Data.addWords(w - (c.words || 0));
      Store.put("chapters", { ...c, text: nt, words: w, writtenAt: Date.now(), status: c.status === "pendiente" ? "borrador" : c.status }, { quiet: true });
      Store.put("ideas", { ...i, usedIn: c.id });
      toast(`Añadida a «${c.title}»`, { glyph: "¶", action: "Ir al texto", onAction: () => (location.hash = "#/c/" + c.id) });
      break;
    }
    case "drawer": {
      const dr = $("#drawer"); if (!dr) break;
      const open = !dr.classList.contains("open");
      if (open) $("#drawer-list").innerHTML = drawerHTML(Store.get("chapters", App.route.args[0]));
      dr.classList.toggle("open", open);
      break;
    }
    case "insert-idea": {
      const i = Store.get("ideas", d.id); const ta = $("#ms"); if (!i || !ta) break;
      const pos = ta.selectionStart ?? ta.value.length; const before = ta.value.slice(0, pos), after = ta.value.slice(pos);
      const chunk = (before && !/\n\s*$/.test(before) ? "\n\n" : "") + (i.text || "").trim() + (after && !/^\s*\n/.test(after) ? "\n\n" : "");
      ta.value = before + chunk + after; ta.dispatchEvent(new Event("input"));
      const cid = App.route.args[0]; Store.put("ideas", { ...i, usedIn: cid, chapterId: i.chapterId || cid }, { quiet: true });
      $("#drawer").classList.remove("open"); ta.focus(); ta.setSelectionRange(pos + chunk.length, pos + chunk.length);
      toast("Idea insertada", { glyph: TYPES[i.type]?.g });
      break;
    }
    case "focus": App.focus = !App.focus; $("#room")?.classList.toggle("focus", App.focus); if (App.focus) toast("Modo enfoque. Pasa el cursor arriba para ver la barra.", { ms: 2600 }); break;
    case "theme-toggle": Store.setMeta({ theme: isDark() ? "light" : "dark" }, { quiet: true }); applyTheme(); el.innerHTML = ico(isDark() ? "sun" : "moon"); break;
    case "theme": Store.setMeta({ theme: d.v }, { quiet: true }); applyTheme(); App.render(); break;
    case "export": exportBackup(); break;
  }
  // chips dentro de vistas (no modales)
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-chip]"); if (!b || b.closest(".modal")) return;
  const n = b.dataset.chip;
  if (n === "idea-type") { const it = $("#idea-text"); const i = Store.get("ideas", App.route.args[0]); if (i) Store.put("ideas", { ...i, text: it ? it.value : i.text, type: b.dataset.v }); }
  else if (n === "idea-char") { const it = $("#idea-text"); const i = Store.get("ideas", App.route.args[0]); if (i) { const s = new Set(i.characterIds || []); s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); Store.put("ideas", { ...i, text: it ? it.value : i.text, characterIds: [...s] }); } }
  else if (n.startsWith("ib-type-")) { const i = Store.get("ideas", n.slice(8)); if (i) Store.put("ideas", { ...i, type: b.dataset.v }); }
});
document.addEventListener("change", async (e) => {
  const el = e.target; const a = el.dataset.act; const d = el.dataset; if (!a) return;
  if (a === "ib-pick") { el.checked ? App.inboxF.sel.add(d.id) : App.inboxF.sel.delete(d.id); el.blur(); App.render(); return; }
  if (a === "ib-all") { const sh = $$(".ib-ck").map((x) => x.dataset.id); if (el.checked) sh.forEach((id) => App.inboxF.sel.add(id)); else App.inboxF.sel.clear(); el.blur(); App.render(); return; }
  if (a === "ib-bulk" && el.value) { const p = Store.get("projects", el.value); const ids = [...App.inboxF.sel]; ids.forEach((id) => { const i = Store.get("ideas", id); if (i) Store.put("ideas", { ...i, projectId: p.id }, { quiet: true }); }); App.inboxF.sel.clear(); el.blur(); App.render(); toast(`${ids.length} ideas enviadas a «${p.title}»`, { glyph: "✦" }); return; }
  if (a === "ib-assign" && el.value) {
    const i = Store.get("ideas", d.id); const p = Store.get("projects", el.value);
    const row = $("#ib-" + d.id); row && row.classList.add("leaving");
    setTimeout(() => { Store.put("ideas", { ...i, projectId: p.id }); toast(`Enviada a «${p.title}»`, { glyph: TYPES[i.type]?.g }); }, 320);
  } else if (a === "idea-field") {
    const it = $("#idea-text"); const i = Store.get("ideas", d.id); const patch = { ...i, text: it ? it.value : i.text, [d.f]: el.value || null };
    if (d.f === "projectId") patch.chapterId = null;
    el.blur(); Store.put("ideas", patch);
  } else if (a === "p-field") {
    const p = Store.get("projects", d.p); if (!p) return;
    if (d.f === "title" && !el.value.trim()) { el.value = p.title; return; }
    const patch = { ...p, [d.f]: d.f === "title" ? el.value.trim() : (el.value || null) };
    if (d.f === "kind") { const cs = Data.chapters(p.id); if (el.value === "cuento" && !cs.length) Store.put("chapters", { id: newId(), projectId: p.id, title: "Texto", order: 0, status: "pendiente", text: "", words: 0 }, { quiet: true }); }
    el.blur(); Store.put("projects", patch);
  } else if (a === "cover" && el.files[0]) {
    try { const url = await compressImage(el.files[0]); const p = Store.get("projects", d.p); Store.put("projects", { ...p, cover: url }); toast("Portada actualizada", { glyph: "✓" }); }
    catch (err) { toast("No se pudo leer esa imagen. Prueba con JPG o PNG."); }
  } else if (a === "import" && el.files[0]) importBackup(el.files[0]);
  else if (a === "sprite-pack" && el.files[0]) { try { await Spr.install(el.files[0]); toast("Sprites cargados en este dispositivo", { glyph: "✓" }); App.render(); } catch (err) { toast("Ese archivo no es un paquete de sprites de INK."); } }
  else if (a === "ch-status") { const c = Store.get("chapters", d.id); Store.put("chapters", { ...c, status: el.value }, { quiet: true }); if (el.value === "final") toast(`«${c.title}» terminado. Un paso más cerca del libro completo.`, { glyph: "✦" }); }
  else if (a === "ch-target") { const c = Store.get("chapters", d.id); Store.put("chapters", { ...c, target: Math.max(0, parseInt(el.value, 10) || 0) || null }, { quiet: true }); }
});
document.addEventListener("input", (e) => {
  const el = e.target; const a = el.dataset.act;
  if (a === "ib-search") { App.inboxF.q = el.value; clearTimeout(App._sT); App._sT = setTimeout(() => { const pos = el.selectionStart; App.render(); const n = $('[data-act="ib-search"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); return; }
  if (a === "idea-search") { App.ideaFilter.q = el.value; clearTimeout(App._sT); App._sT = setTimeout(() => { const pos = el.selectionStart; App.render(); const n = $('[data-act="idea-search"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  else if (a === "ch-title") { clearTimeout(App._tT); App._tT = setTimeout(() => { const c = Store.get("chapters", el.dataset.id); if (c && el.value.trim()) Store.put("chapters", { ...c, title: el.value.trim() }, { quiet: true }); }, 500); }
});
document.addEventListener("focusout", () => { setTimeout(() => { const a = document.activeElement; const typing = a && ["TEXTAREA", "INPUT", "SELECT"].includes(a.tagName) && $("#view").contains(a); if (App.pending && !typing && !$("#modal").innerHTML && App.route.name !== "chapter") App.render(); }, 50); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#modal").innerHTML) closeModal(); else $("#drawer")?.classList.remove("open"); return; }
  const a = document.activeElement; const typing = a && (["TEXTAREA", "INPUT", "SELECT"].includes(a.tagName) || a.isContentEditable);
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "n" || e.key === "N") && !$("#modal").innerHTML) { e.preventDefault(); openCapture(); }
});
window.addEventListener("hashchange", () => { closeModalSilently(); App.render(); });
function closeModalSilently() { $("#modal").innerHTML = ""; }
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if ((Store.meta().theme || "auto") === "auto" && App.route.name === "chapter") { const b = $('[data-act="theme-toggle"]'); if (b) b.innerHTML = ico(isDark() ? "sun" : "moon"); } });

window.addEventListener("storage", (e) => {
  if (e.key !== LS_KEY || !e.newValue) return;
  try {
    const s = JSON.parse(e.newValue); let changed = false;
    for (const c of COLLS) for (const [id, r] of Object.entries(s[c] || {})) { const l = Store.state[c][id]; if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { Store.state[c][id] = r; changed = true; } }
    if (s.meta && (s.meta.updatedAt || 0) > (Store.state.meta.updatedAt || 0)) { Store.state.meta = s.meta; changed = true; applyTheme(); }
    if (changed) App.changed("all", true);
  } catch (err) { /* ignorar */ }
});

/* ================= Arranque ================= */
Store.load(); applyTheme(); App.render(); Store.connect();

</script>
</body>
</html>
