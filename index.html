<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2130">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="INK">
<title>INK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBE6; --surface:#F6F6F2; --surface-2:#EEEFE9; --ink:#1B2130; --muted:#5C6371; --line:#D6D9D1;
  --shadow:0 1px 2px rgba(27,33,48,.06),0 8px 24px -12px rgba(27,33,48,.18);
  --paper:#FBFBF8; --paper-ink:#1E2230;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --r-s:8px; --r-m:14px; --r-l:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161B; --surface:#1C1F26; --surface-2:#232731; --ink:#E7E3D9; --muted:#9A9EA8; --line:#2F333D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --paper:#191B21; --paper-ink:#DCD6C9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B; --surface:#1C1F26; --surface-2:#232731; --ink:#E7E3D9; --muted:#9A9EA8; --line:#2F333D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --paper:#191B21; --paper-ink:#DCD6C9; color-scheme:dark;
}
/* Genre atmospheres */
[data-genre]{--accent:var(--a-l);--accent-2:var(--g-l)}
:root[data-theme="dark"] [data-genre]{--accent:var(--a-d);--accent-2:var(--g-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-genre]{--accent:var(--a-d);--accent-2:var(--g-d)}}
[data-genre="tinta"]{--a-l:#2B4C8C;--a-d:#93B2EE;--g-l:#9C7A2B;--g-d:#D9B96A}
[data-genre="fantasia"]{--a-l:#5A3E92;--a-d:#BBA4EA;--g-l:#9A7629;--g-d:#D8B868}
[data-genre="drama"]{--a-l:#8B3346;--a-d:#E3909F;--g-l:#4B5B70;--g-d:#A3B5CC}
[data-genre="misterio"]{--a-l:#22625F;--a-d:#72C4BD;--g-l:#6B5B3A;--g-d:#C9B38A}
[data-genre="romance"]{--a-l:#A04C6C;--a-d:#EBA3BE;--g-l:#A8733F;--g-d:#E6BB8F}
[data-genre="scifi"]{--a-l:#1D6B89;--a-d:#76C6E2;--g-l:#5B5F9E;--g-d:#A9ADEA}
[data-genre="realista"]{--a-l:#34568A;--a-d:#98B4E4;--g-l:#617345;--g-d:#B6C993}
[data-genre="terror"]{--a-l:#6E2C2C;--a-d:#DB9083;--g-l:#3F4B40;--g-d:#9DB29F}

html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .4s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
img{max-width:100%}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface-2);overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;text-decoration:none}
.side .brand svg{height:30px;width:auto}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;text-align:left;text-decoration:none;color:var(--ink);font-weight:500}
.nav-btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav-btn[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow);font-weight:650}
.nav-btn .ico{width:18px;height:18px;flex:none;opacity:.8}
.nav-btn .count{margin-left:auto;font-size:12px;font-weight:700;background:var(--accent);color:var(--surface);border-radius:999px;padding:1px 8px}
.side h3{font-size:12px;font-weight:600;color:var(--muted);margin:16px 10px 4px}
.side .book-link .dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--accent)}
.side .book-link span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .grow{flex:1}
.capture-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px;padding:11px 14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 6px 18px -8px var(--accent)}
.capture-btn:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .capture-btn{color:#14161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .capture-btn{color:#14161B}}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:8px 10px}
.sync i{width:8px;height:8px;border-radius:50%;background:#8a8f99;flex:none}
.sync[data-s="ok"] i{background:#3F9A6B}
.sync[data-s="busy"] i{background:#C9A24A;animation:pulse 1s infinite alternate}
.sync[data-s="offline"] i{background:#C06A4A}
@keyframes pulse{to{opacity:.35}}

main#view{min-width:0;padding:34px clamp(18px,4vw,56px) 120px;max-width:1180px;width:100%}
.tabbar{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main#view{padding:22px 16px 130px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;padding:6px 0}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar .ico{width:22px;height:22px}
  .tabbar .fab{align-self:center;justify-self:center;width:56px;height:56px;margin-top:-26px;border-radius:18px;background:var(--accent);color:#fff;box-shadow:0 10px 24px -8px var(--accent);justify-content:center}
  .tabbar .fab .ico{width:26px;height:26px}
  .tabbar .badge{position:absolute;margin-left:18px;margin-top:-4px;background:var(--accent);color:#fff;font-size:10px;border-radius:999px;padding:0 5px}
}

/* ---------- Common ---------- */
.page-title{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 26px;max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:650;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
:root[data-theme="dark"] .btn.primary{color:#14161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#14161B}}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.danger{color:#B2413A}
.btn.small{padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn .ico{width:17px;height:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px}
.section-h{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px}
.section-h h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:0}
.section-h .spacer{flex:1}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:650;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.chip .g{font-family:var(--serif);color:var(--accent);font-size:15px;line-height:1}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff}
.chip[aria-pressed="true"] .g{color:inherit}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#14161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#14161B}}
.chip .dot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
.chip[aria-pressed="true"] .dot{background:currentColor}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{font-family:var(--serif);color:var(--ink);font-size:22px;font-weight:600;margin:12px 0 6px}
.empty p{max-width:44ch;margin:0 auto 18px}

/* ---------- Covers ---------- */
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--c1);color:#F5F1E6;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),inset 8px 0 0 rgba(255,255,255,.06),0 18px 34px -16px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.18)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14% 12% 12% 16%;background:radial-gradient(120% 80% at 70% 10%,var(--c2),transparent 60%),linear-gradient(160deg,var(--c1),var(--c3))}
.cover .gen .orn{font-family:var(--serif);font-size:1.4em;opacity:.75}
.cover .gen .ttl{font-family:var(--serif);font-weight:600;line-height:1.08;font-size:var(--ts,22px);text-wrap:balance;overflow-wrap:anywhere}
.cover .gen .rule{width:34%;height:1px;background:currentColor;opacity:.5;margin-top:10px}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.08) 60%,transparent)}

/* ---------- Home ---------- */
.greet{font-size:14px;color:var(--muted);margin:0 0 20px;font-weight:600}
.hero{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:clamp(22px,4vw,48px);align-items:center;padding:clamp(20px,3vw,34px);border-radius:var(--r-l);background:radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero .cover-wrap{transform:rotate(-2.5deg);transition:transform .5s}
.hero .cover-wrap:hover{transform:rotate(0)}
.hero .cover{--ts:clamp(18px,2.4vw,26px)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,52px);line-height:1.02;letter-spacing:-.015em;margin:0 0 10px;text-wrap:balance}
.hero .meta{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:18px}
.prompt{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.8vw,20px);line-height:1.45;margin:0 0 22px;max-width:40ch;padding-left:14px;border-left:2px solid var(--accent-2)}
.progress{margin:0 0 20px;max-width:460px}
.progress .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.progress .bar span{display:block;height:100%}
.progress .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.progress .legend b{color:var(--ink)}
.st-final{background:var(--accent)} .st-revision{background:color-mix(in srgb,var(--accent) 65%,var(--surface))} .st-borrador{background:var(--accent-2)} .st-pendiente{background:color-mix(in srgb,var(--ink) 18%,transparent)}
.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:980px){.home-grid{grid-template-columns:1fr}}
@media (max-width:620px){.hero{grid-template-columns:1fr;text-align:left}.hero .cover-wrap{width:48%;max-width:180px}}
.week{display:flex;gap:8px;margin:14px 0 10px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week .d i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.week .d.on i{background:var(--accent);border:0;color:#fff}
.week .d.today{color:var(--ink)}
.week .d.today i{border-color:var(--accent)}
.card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px}
.rescue blockquote{font-family:var(--serif);font-size:17px;line-height:1.55;margin:12px 0 14px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:22px}
.shelf .book{text-decoration:none;border:0;background:none;padding:0;text-align:left}
.shelf .book .cover{--ts:15px;transition:transform .3s}
.shelf .book:hover .cover{transform:translateY(-4px)}
.shelf .book .n{font-weight:700;font-size:14px;margin-top:10px;line-height:1.3}
.shelf .book .s{font-size:12.5px;color:var(--muted)}
.shelf .new-book{aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:4px 10px 10px 4px;display:grid;place-items:center;color:var(--muted);font-weight:650;background:none;width:100%}
.shelf .new-book:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Project ---------- */
.p-head{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px}
.p-head .cover{width:96px;flex:none;--ts:12px}
.p-head .sub{color:var(--muted);font-weight:600;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.chapters{display:flex;flex-direction:column;gap:8px}
.chap{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);text-decoration:none}
.chap:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.chap .num{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--accent);text-align:center}
.chap .t{font-weight:700;font-size:16px}
.chap .m{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.chap .mini{height:3px;border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-top:8px;max-width:260px;overflow:hidden}
.chap .mini span{display:block;height:100%;background:var(--accent)}
.chap .ord{display:flex;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:none;color:var(--muted)}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.icon-btn .ico{width:18px;height:18px}
.soon{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:28px;border-radius:var(--r-l);border:1.5px dashed var(--line)}
.soon .faces{display:flex}
.soon .faces span{width:54px;height:54px;border-radius:50%;margin-left:-12px;border:3px solid var(--bg);display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:#fff}
.soon .faces span:first-child{margin-left:0}

/* ---------- Ideas ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar .input{max-width:280px}
.ideas{columns:3 280px;column-gap:14px}
.idea{break-inside:avoid;display:block;margin:0 0 14px;padding:16px 16px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);text-decoration:none;position:relative}
.idea:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.idea .k{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.idea .k .g{font-family:var(--serif);color:var(--accent);font-size:16px}
.idea .k .when{margin-left:auto;font-weight:500}
.idea .tx{font-family:var(--serif);font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.idea.voz .tx{font-style:italic}
.idea .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inbox-item{display:grid;gap:12px;padding:18px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.inbox-item .tx{font-family:var(--serif);font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.inbox-item .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inbox-item .acts select{width:auto;min-width:200px}
.leaving{animation:leave .35s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(30px)}}

/* ---------- Idea editor ---------- */
.idea-ed{max-width:760px}
.idea-ed textarea.write{width:100%;min-height:46vh;border:0;background:transparent;outline:none;resize:none;font-family:var(--serif);font-size:19px;line-height:1.75;color:var(--ink);padding:6px 0}
.origin{margin:18px 0;padding:14px 16px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.origin q{font-family:var(--serif);font-style:italic;color:var(--ink)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.meta-grid{grid-template-columns:1fr}}

/* ---------- Writing room ---------- */
body.writing .side,body.writing .tabbar{display:none}
body.writing .app{grid-template-columns:1fr}
body.writing main#view{max-width:none;padding:0}
.room{min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column}
.room-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);transition:opacity .4s}
.room-bar .ttl{font-weight:700;border:0;background:none;outline:none;min-width:0;flex:1;font-size:15px;padding:6px 8px;border-radius:8px}
.room-bar .ttl:focus{background:var(--surface-2)}
.room-bar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:13px;font-weight:600}
.room-bar .wc{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.room.focus .room-bar{opacity:.12}
.room.focus .room-bar:hover,.room.focus .room-bar:focus-within{opacity:1}
.room-body{flex:1;display:flex;justify-content:center;padding:clamp(28px,6vh,70px) 22px 40vh}
.room-body .sheet{width:100%;max-width:68ch}
.room .chap-label{font-family:var(--serif);font-size:15px;color:var(--accent);margin-bottom:6px}
.room .chap-title{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:600;line-height:1.1;margin:0 0 34px;color:var(--paper-ink)}
.room textarea.manuscript{width:100%;border:0;background:transparent;outline:none;resize:none;overflow:hidden;font-family:var(--serif);font-size:clamp(17px,1.3vw + 11px,20px);line-height:1.8;color:var(--paper-ink);caret-color:var(--accent);min-height:50vh}
.room textarea.manuscript::placeholder{color:color-mix(in srgb,var(--paper-ink) 35%,transparent);font-style:italic}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:30;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;flex:1}
.drawer .list{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.drawer .d-idea{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.drawer .d-idea .tx{font-family:var(--serif);font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 10px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.drawer h4{font-size:12.5px;color:var(--muted);margin:10px 0 0;font-weight:700}

/* ---------- Modal & toast ---------- */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(6vh,calc(env(safe-area-inset-top,0px) + 16px)) 14px 14px;overflow-y:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);background:var(--surface);border-radius:var(--r-l);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);padding:22px;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.modal h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 14px}
.modal .cap{width:100%;min-height:150px;border:0;outline:none;resize:vertical;background:transparent;font-family:var(--serif);font-size:19px;line-height:1.6;padding:4px 0 10px}
.modal .lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.modal .foot{display:flex;gap:10px;align-items:center;margin-top:20px}
.modal .foot .hint{font-size:12px;color:var(--muted)}
@media (max-width:620px){.modal-back{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}.modal .foot .hint{display:none}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 28px))}
@media (max-width:860px){#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:12px 14px 12px 18px;border-radius:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);font-weight:600;font-size:14px;animation:rise .25s ease}
.toast .g{font-family:var(--serif);color:var(--accent-2);font-size:18px}
.toast button{margin-left:auto;background:none;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:inherit;border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px}
.toast.big{flex-direction:column;align-items:flex-start;gap:4px;padding:16px 18px}
.toast.big .n{font-family:var(--serif);font-size:26px;font-weight:600}

/* ---------- Settings ---------- */
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.settings{display:grid;gap:18px;max-width:720px}
.settings .card h3{margin-bottom:6px}
.settings .card p{color:var(--muted);margin:0 0 14px}
.cover-edit{display:flex;gap:18px;align-items:flex-end}
.cover-edit .cover{width:110px;--ts:13px}

.ico{display:inline-block;vertical-align:middle;width:1.15em;height:1.15em;flex:none}
.capture-btn .ico{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root[data-theme="dark"] .week .d.on i,:root[data-theme="dark"] .tabbar .fab{color:#14161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .week .d.on i,:root:not([data-theme="light"]) .tabbar .fab{color:#14161B}}
.room-bar .bk{font-size:13.5px;font-weight:650;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.room .chap-title{display:block;width:100%;border:0;background:transparent;outline:none;padding:0}
.room .chap-title:focus{border-bottom:1px dashed var(--line)}
.wc-m{display:none;margin-left:10px;color:var(--muted);font-family:var(--ui);font-size:12.5px;font-weight:600}
@media (max-width:560px){.room-bar .wc,.room-bar .bk{display:none}.wc-m{display:inline}.idea-ed textarea.write{min-height:26vh}}

/* ================= Fase 2.1 · Personajes ================= */
.av{--s:48px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-family:var(--serif);font-weight:600;font-size:calc(var(--s) * .38);letter-spacing:.02em;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ring);line-height:1}
.pill .av,.chip .av{box-shadow:none;font-size:calc(var(--s) * .42)}
.chip.char-chip{padding-left:5px}
.chip.char-chip[aria-pressed="true"] .av{box-shadow:0 0 0 2px #fff}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.char-card{display:flex;gap:16px;align-items:flex-start;padding:16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);text-decoration:none}
.char-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.char-card .nm{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.2}
.char-card .sm{font-size:13px;color:var(--muted);margin-top:2px}
.char-card .one{font-size:14px;margin-top:8px;line-height:1.45}
.char-card .ft{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.faces-empty{display:flex;justify-content:center}
.faces-empty span{width:56px;height:56px;border-radius:50%;margin-left:-12px;border:3px solid var(--bg);display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:#fff}
.faces-empty span:first-child{margin-left:0}
.seg .ico{width:16px;height:16px;margin-right:4px}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));margin-bottom:12px;font-size:14px}
.graph-wrap{border-radius:var(--r-l);border:1px solid var(--line);background:radial-gradient(70% 70% at 50% 45%,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface));overflow:hidden}
#graph{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#graph .node{cursor:grab;transition:opacity .2s}
#graph .node:active{cursor:grabbing}
#graph .node.dim,#graph .edge.dim{opacity:.18}
#graph .node .halo{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
#graph .node.from circle:nth-of-type(1){stroke:var(--accent);stroke-width:5;stroke-dasharray:6 5}
#graph .node:focus{outline:none}
#graph .node:focus-visible .ini{text-decoration:underline}
#graph .ini{fill:#fff;font-family:var(--serif);font-weight:600;text-anchor:middle;pointer-events:none}
#graph .nlabel{fill:var(--ink);font-family:var(--ui);font-weight:700;font-size:17px;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
#graph .edge{transition:opacity .2s}
#graph .edge .hit{stroke:transparent;stroke-width:22;cursor:pointer;fill:none}
#graph .elabel{fill:var(--ink);font-family:var(--ui);font-weight:700;font-size:15px;paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:22px;height:0}
.sel-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sel-card .nm{font-family:var(--serif);font-size:18px;font-weight:600}
.sel-card .sm{font-size:13px;color:var(--muted)}
.rel-list{display:flex;flex-direction:column;gap:8px}
.rel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rel-row .rname{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700}
.rel-row .rname .av{box-shadow:none}
.rel-row .rtype{font-size:13.5px;color:var(--muted);font-weight:600}
.rel-row .rnote{flex:1;min-width:140px;font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--muted)}
.rdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

.char-page{max-width:880px}
.char-head{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
@media (max-width:620px){.char-head{grid-template-columns:1fr}}
.av-big{display:flex;flex-direction:column;align-items:center;gap:14px}
.av-big .av{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--ring),0 18px 30px -14px rgba(0,0,0,.45)}
.swatches{display:grid;grid-template-columns:repeat(6,18px);gap:6px}
.swatches button{width:18px;height:18px;border-radius:50%;border:0;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.ch-name{width:100%;border:0;background:none;outline:none;font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.4vw,46px);line-height:1.1;padding:0;margin:0 0 4px;letter-spacing:-.01em}
.ch-sum{width:100%;border:0;background:none;outline:none;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);padding:0;margin:0 0 18px}
.ch-name:focus,.ch-sum:focus{border-bottom:1px dashed var(--line)}
.id-grid{display:grid;grid-template-columns:150px 110px 1fr;gap:0 12px}
.id-grid .field:last-child{grid-column:1/-1}
@media (max-width:620px){.id-grid{grid-template-columns:1fr 1fr}.id-grid .field:nth-child(3){grid-column:1/-1}}
.avatar-soon{display:flex;align-items:center;gap:10px;margin:22px 0 8px;padding:12px 14px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:13.5px}
.secs{display:flex;flex-direction:column;gap:8px;margin-top:16px}
details.sec{border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
details.sec summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:10px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);justify-self:end;grid-column:3;grid-row:1;transition:transform .2s;margin-right:4px}
details.sec[open] summary::after{transform:rotate(-135deg)}
details.sec .st{font-family:var(--serif);font-size:18px;font-weight:600}
details.sec .done{width:8px;height:8px;border-radius:50%;background:var(--accent)}
details.sec .sd{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:2px}
details.sec .sb{padding:4px 18px 18px}
details.sec textarea.grow{resize:none;overflow:hidden;font-family:var(--serif);font-size:16px;line-height:1.6}
.temper{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.tp{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;align-items:center;font-size:13.5px;font-weight:600}
.tp span:last-child{text-align:right}
.tp input{width:100%;accent-color:var(--accent)}
.tp input.unset{opacity:.35}
.linked{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.linked .lh{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.linked .li{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--serif);font-size:15px;line-height:1.5}
.linked .btn{margin-top:8px}
.versions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none}
.ver.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ver .nm{font-weight:700}
.ver .sm{font-size:12.5px;color:var(--muted)}
.ver-arrow{width:22px;height:2px;background:var(--line);position:relative}
.ver-arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--line);border-right:0}
.diff .dr{display:grid;grid-template-columns:130px 1fr 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.diff .dl{font-weight:700;color:var(--muted)}
.diff .db,.diff .da{white-space:pre-wrap;overflow-wrap:anywhere}
.diff .db span,.diff .da span{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.diff .da span{color:var(--accent)}
@media (max-width:620px){.diff .dr{grid-template-columns:1fr 1fr}.diff .dl{grid-column:1/-1}}
.bring{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.bring-it{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.bring-it:hover:not(:disabled){border-color:var(--accent)}
.bring-it:disabled{opacity:.5;cursor:default}
.bring-it span{display:flex;flex-direction:column}
.bring-it small{color:var(--muted);font-size:12px}
.input,details.sec *{box-sizing:border-box}

/* ================= Fase 2.2 · Avatar ================= */
.av.has-img{background:var(--c);overflow:hidden}
.av.has-img img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av-link{display:block;border-radius:50%;text-decoration:none}
.av-link:hover .av{filter:brightness(1.05)}
.name-row{display:flex;gap:8px;align-items:center}
.name-row .ch-name{flex:1;min-width:0}
.avatar-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin:22px 0 8px;padding:16px 18px;border-radius:var(--r-m);background:radial-gradient(80% 140% at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),var(--surface);border:1px solid var(--line)}
.emo-gal{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
@media (max-width:760px){.emo-gal{grid-template-columns:repeat(5,minmax(0,1fr))}}
.emo-gal figure{margin:0;text-align:center}
.emo-gal figcaption{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.ei{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;background:var(--surface-2);overflow:hidden}
.ei img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.credit{font-size:12px;color:var(--muted);margin:10px 0 0}
.av-page{max-width:1120px}
.av-grid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:28px;align-items:start}
@media (max-width:900px){.av-grid{grid-template-columns:1fr}}
.av-left{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.av-left{position:static}}
.av-stage{aspect-ratio:1;border-radius:var(--r-l);background:radial-gradient(70% 70% at 50% 40%,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface-2));border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.av-stage .cv{width:100%;height:100%;object-fit:contain;object-position:50% 0}
.av-stage img{width:100%;height:100%;object-fit:contain}
.av-stage canvas.cv{width:auto;height:100%;max-width:100%}
.emo-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.emo-strip button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.emo-strip button small{font-size:11px;font-weight:600}
.emo-strip button[aria-pressed="true"] .ei{box-shadow:0 0 0 2px var(--accent)}
.emo-strip button[aria-pressed="true"] small{color:var(--ink)}
.looks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.look-acts{margin-top:10px}
.engine-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.eng{display:flex;gap:16px;align-items:center;text-align:left;padding:18px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface)}
.eng:hover{border-color:var(--accent)}
.eng h3{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.eng p{margin:0 0 10px;color:var(--muted);font-size:14px}
.eng-prev{width:120px;height:120px;flex:none;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.eng-prev img{width:100%;height:100%;object-fit:cover}
.avsec{margin-bottom:22px}
.avsec h4{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tile:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile small{font-size:11.5px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.tp{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:9px;background:var(--surface-2);overflow:hidden}
.tp img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
.tp.txt{font-family:var(--serif);font-size:22px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sliders{display:grid;gap:8px;margin-top:12px}
.sliders label{display:grid;grid-template-columns:84px 1fr;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.sliders input{accent-color:var(--accent)}
.crow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:6px 0}
.crow .cl{font-size:13px;font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.swb{width:26px;height:26px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swb.auto{background:var(--surface-2);font-size:11px;font-weight:800;color:var(--muted)}
.swb.pick{position:relative;overflow:hidden;background:conic-gradient(#e44,#ee4,#4e4,#4ee,#44e,#e4e,#e44)}
.swb.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.emo-rows{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.emo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;border-radius:12px;background:var(--surface-2)}
.emo-row .ep{width:54px;height:54px;border-radius:12px;overflow:hidden;background:var(--surface);flex:none}
.emo-row .ep img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.emo-row b{width:100px}
.emo-row select{width:auto;min-width:130px;padding:6px 8px}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.ng-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ng-names{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ng-name{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.ng-name .use{border:0;background:none;padding:7px 4px 7px 14px;font-family:var(--serif);font-size:16px}
.ng-name .use:hover{color:var(--accent)}
.ng-name .fav{border:0;background:none;padding:0 11px 0 6px;color:var(--accent-2);font-size:15px}
#nc-ng{margin-bottom:8px}
.otile .tp img{object-position:50% 92%;transform:scale(1.35);transform-origin:50% 90%}
.ei img{object-position:50% 50%}
.emo-row .ep img{object-position:50% 50%}
.hue{background:linear-gradient(90deg,#e44,#ee4,#4e4,#4ee,#44e,#e4e,#e44);border-radius:9px;height:8px;-webkit-appearance:none;appearance:none}
@media (max-width:900px){.av-stage{max-width:320px;margin:0 auto}.emo-strip{max-width:420px;margin:12px auto}}

/* ================= Fase 2.3 · Escena ================= */
.cast-panel{position:fixed;right:18px;top:calc(72px + env(safe-area-inset-top,0px));width:178px;max-height:calc(100vh - 100px);overflow-y:auto;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);transition:opacity .3s}
.room.focus .cast-panel{opacity:.25}
.room.focus .cast-panel:hover{opacity:1}
.cast-panel.closed{width:auto;padding:4px 4px 4px 10px}
.cp-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cp-h b{flex:1;font-weight:700}
.cp-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;margin-top:8px}
.cp-face{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;color:var(--ink);transition:opacity .2s,filter .2s}
.cp-face small{font-size:11.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpi{width:58px;height:58px;border-radius:50%;display:block;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.cpi img{width:100%;height:100%;object-fit:cover;border-radius:50%;background:var(--surface-2)}
.cpi .av{box-shadow:none}
.cp-face.st-mencion{opacity:.5;filter:grayscale(.85)}
.cp-face.st-mencion .cpi{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--line)}
.cp-face.st-pensamiento .cpi{box-shadow:0 0 0 2px var(--surface),0 0 0 4px transparent;outline:2px dashed var(--accent-2);outline-offset:3px;opacity:.8}
.cp-face.speaking .cpi{box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--accent-2),0 0 18px 2px color-mix(in srgb,var(--accent-2) 60%,transparent)}
.cp-face.on{opacity:1;filter:none}
.cp-tag{font-style:normal;font-size:10px;color:var(--muted);font-weight:600;margin-top:-2px}
.cp-pop{grid-column:1/-1;background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px}
.cp-states,.cp-emos{display:flex;flex-wrap:wrap;gap:4px}
.cp-states button,.cp-emos button,.cp-btns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}
.cp-states button[aria-pressed="true"],.cp-emos button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff}
:root[data-theme="dark"] .cp-states button[aria-pressed="true"],:root[data-theme="dark"] .cp-emos button[aria-pressed="true"]{color:#14161B}
.cp-pop .btn.small{padding:4px 8px;font-size:12px}
.cp-sugs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cp-sug{font-size:12px;background:color-mix(in srgb,var(--accent-2) 14%,var(--surface));border-radius:10px;padding:7px}
.cp-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.cp-empty{font-size:12px;color:var(--muted);margin:8px 0 0}
.cp-tip{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.cp-add{margin-top:10px;font-size:12px}
.cp-add summary{cursor:pointer;font-weight:700;color:var(--muted);list-style:none;display:flex;align-items:center;gap:4px}
.cp-add summary::-webkit-details-marker{display:none}
.cp-add div{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cp-add button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:3px;font-size:12px;font-weight:600;text-align:left;border-radius:8px}
.cp-add button:hover{background:var(--surface-2)}
.cp-add .av{box-shadow:none}
@media (max-width:1180px){
  .cast-panel{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));right:auto;width:auto;max-height:none;margin:0;border-radius:0;border-width:0 0 1px;padding:8px 14px;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;box-shadow:none}
  .cast-panel .cp-h{flex-direction:column;align-items:flex-start;min-width:60px}
  .cp-list{display:flex;margin-top:0;gap:10px}
  .cpi{width:44px;height:44px}
  .cp-pop{min-width:220px}
  .cp-sugs{margin-top:0;flex-direction:row}
  .cp-sug{min-width:180px}
  .cp-tip{display:none}
  .cp-add{margin-top:6px;min-width:90px}
}
.st-cast-escena{background:var(--accent)}.st-cast-mencion{background:var(--line)}.st-cast-pensamiento{background:var(--accent-2)}
.cpi .av{width:100%!important;height:100%!important;font-size:calc(var(--s) * .34)}

/* ================= Fase 3 · Modo Editor ================= */
.ed-btn{font-size:13px}
.count-b{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11.5px;text-align:center;margin-left:4px}
:root[data-theme="dark"] .count-b{color:#14161B}
.ed-banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-family:var(--ui);font-size:13.5px;color:var(--ink);margin:-14px 0 24px}
.manuscript.review{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--serif);font-size:clamp(17px,1.3vw + 11px,20px);line-height:1.8;color:var(--paper-ink);min-height:40vh}
.review mark{background:none;color:inherit;border-radius:3px;cursor:pointer;padding:0 1px;transition:background .2s}
.review mark.revisar{background:color-mix(in srgb,#E0564B 16%,transparent);border-bottom:2px solid #E0564B}
.review mark.considerar{border-bottom:2px solid color-mix(in srgb,var(--accent-2) 85%,transparent);background:color-mix(in srgb,var(--accent-2) 10%,transparent)}
.review mark.opcional{border-bottom:2px dotted var(--muted)}
.review mark.ed-larga,.review mark.ed-que{border-bottom:0;background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:inset 3px 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}
.review mark:hover{background:color-mix(in srgb,var(--accent-2) 26%,transparent)}
.review mark.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--accent) 45%,transparent)}}
.ed-drawer{width:min(400px,94vw)}
@media (min-width:1200px){.room.edmode .room-body{padding-right:min(420px,32vw)}}
.ed-drawer .list{gap:16px}
.ed-drawer h4{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 8px}
.ed-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed-stats div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.ed-stats b{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.ed-stats span{font-size:12px;color:var(--muted);font-weight:600}
.ed-cats{display:flex;flex-direction:column;gap:4px}
.ed-cat{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;padding:6px 8px;border-radius:10px;text-align:left;font-size:13.5px;font-weight:600}
.ed-cat:hover{background:var(--surface-2)}
.ed-cat[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ed-cat .l{flex:1}
.ed-cat b{font-size:12px;min-width:26px;text-align:center;border-radius:99px;background:var(--surface-2);padding:1px 6px}
.ed-cat.off{opacity:.45}
.ed-cat .g,.ed-item .g{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-family:var(--serif);font-size:13px;font-weight:700;background:var(--surface-2)}
.g.ed-signos,.g.ed-dialogo,.g.ed-espacios{color:#C0433B}
.g.ed-tuyas,.g.ed-muletillas,.g.ed-repeticion,.g.ed-mente,.g.ed-comodin{color:var(--accent-2)}
.g.ed-larga,.g.ed-que{color:var(--accent)}
.ed-items{display:flex;flex-direction:column;gap:8px}
.ed-item{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent}
.ed-item.sel{border-color:var(--accent)}
.ed-item .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.ed-item .x{font-family:var(--serif);font-size:14.5px;line-height:1.5;margin:8px 0 4px;overflow-wrap:anywhere}
.ed-item .x mark{background:color-mix(in srgb,var(--accent-2) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.ed-item .m{font-size:13px;margin:0 0 8px}
.ed-item .btn.small{padding:4px 9px;font-size:12.5px}
@media (max-width:620px){.room-bar .ed-btn{padding:6px 8px}.room-bar [data-ed-act="exit"]{font-size:0}.room-bar [data-ed-act="exit"] .ico{font-size:15px}}
.ed-drawer{top:calc(53px + env(safe-area-inset-top,0px));border-top:1px solid var(--line)}
@media (max-width:620px){.room.edmode .room-bar select,.room.edmode .room-bar [data-act="focus"]{display:none}.room-bar{max-width:100vw;overflow:hidden}}
body.writing{overflow-x:hidden}

/* ================= Fase 4 ================= */
.bk-sizes{grid-template-columns:repeat(4,minmax(0,1fr))}
.bk-shape{display:block;width:44%;margin:6px auto 2px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1.5px solid var(--accent);border-radius:2px 5px 5px 2px}
.bk-sizes .tile small{font-weight:500}
.bk-opts{display:flex;flex-direction:column;gap:8px}
.steps{margin:0 0 16px;padding-left:20px;font-size:14px;line-height:1.6}
.drop{display:flex;align-items:center;gap:14px;padding:18px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;background:var(--surface-2)}
.drop:hover{border-color:var(--accent)}
.drop .ico{width:26px;height:26px;color:var(--accent)}
#kp-res{margin-top:14px}
.kp-sum{font-size:14px;line-height:1.55;margin-bottom:10px}
.ib-bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;border-radius:12px;background:var(--surface-2)}
.ib-bulk.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ib-bulk select{width:auto;min-width:200px;padding:6px 10px}
.ib-ck{width:18px;height:18px;accent-color:var(--accent)}
.inbox-item.picked{border-color:var(--accent)}
.backup-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;border-color:color-mix(in srgb,var(--accent-2) 45%,var(--line))}
.card.pack h3{font-family:var(--serif)}

</style>

function ago(ts) {
  if (!ts) return "";
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "ahora";
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;

/* ================= Almacenamiento local + sincronización ================= */
const Store = {
  state: { projects: {}, ideas: {}, chapters: {}, characters: {}, relations: {}, meta: {} },
  dirty: new Set(),
  base: null,
  status: "local",
  synced: {},
  _pT: 0, _fT: 0, flushing: false,

  load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        for (const c of COLLS) this.state[c] = s[c] || {};
        this.state.meta = s.meta || {};
      }
      const d = localStorage.getItem(LS_DIRTY);
      if (d) this.dirty = new Set(JSON.parse(d));
    } catch (e) { /* almacenamiento vacío o no disponible */ }
  },
  persist() {
    clearTimeout(this._pT);
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(this.state));
      localStorage.setItem(LS_DIRTY, JSON.stringify([...this.dirty]));
    } catch (e) {
      if (!this._warned) { this._warned = true; toast("Este dispositivo se quedó sin espacio local. Descarga un respaldo desde Ajustes."); }
    }
  },
  persistSoon() { clearTimeout(this._pT); this._pT = setTimeout(() => this.persist(), 500); },

  list(c) { return Object.values(this.state[c]).filter((r) => !r.deleted); },
  get(c, id) { const r = this.state[c][id]; return r && !r.deleted ? r : null; },
  put(c, rec, { quiet } = {}) {
    const now = Date.now();
    rec = { ...rec, updatedAt: now };
    if (!rec.createdAt) rec.createdAt = now;
    this.state[c][rec.id] = rec;
    this.dirty.add(c + ":" + rec.id);
    this.persistSoon(); this.flushSoon();
    if (!quiet) App.changed(c);
    return rec;
  },
  remove(c, id) { const r = this.state[c][id]; if (r) this.put(c, { ...r, deleted: true }); },
  meta() { return this.state.meta; },
  setMeta(patch, opts = {}) {
    this.state.meta = { ...this.state.meta, ...patch, updatedAt: Date.now() };
    this.dirty.add("meta:meta");
    this.persistSoon(); this.flushSoon();
    if (!opts.quiet) App.changed("meta");
  },

  setStatus(s) { this.status = s; const el = $("#sync"); if (el) { el.dataset.s = s; el.querySelector("span").textContent = SYNC_TEXT[s]; } },

  async connect() {
    if (!window.claude || typeof window.claude.use !== "function") { if (typeof SB !== "undefined" && SB.ready()) this.startSB(); else this.setStatus("local"); return; }
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { this.setStatus("local"); return; }
      const uid = await user.id();
      if (!uid) { this.setStatus("local"); return; }
      this.base = db.doc(`data/users/${uid}/ink`);
      this.subscribe();
      this.flushSoon(300);
    } catch (e) { this.setStatus("local"); }
  },
  subscribe() {
    for (const c of COLLS) {
      this.base.collection(c).onSnapshot(
        (snap) => this.applyRemote(c, snap),
        (err) => this.onErr(err)
      );
    }
    this.base.onSnapshot((d) => {
      const key = "meta:meta";
      if (d.exists) {
        const r = d.data();
        if (this.dirty.has(key)) return;
        if ((r.updatedAt || 0) > (this.state.meta.updatedAt || 0)) { this.state.meta = JSON.parse(JSON.stringify(r)); this.persistSoon(); App.changed("meta", true); }
        else if ((r.updatedAt || 0) < (this.state.meta.updatedAt || 0)) { this.dirty.add(key); this.flushSoon(); }
      } else if (!d.metadata.fromCache && this.state.meta.updatedAt) { this.dirty.add(key); this.flushSoon(); }
    }, (err) => this.onErr(err));
  },
  applyRemote(c, snap) {
    let changed = false;
    const seen = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      const r = d.data(); const l = this.state[c][d.id]; const key = c + ":" + d.id;
      if (this.dirty.has(key)) continue;
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { this.state[c][d.id] = JSON.parse(JSON.stringify({ ...r, id: d.id })); changed = true; }
      else if ((l.updatedAt || 0) > (r.updatedAt || 0)) { this.dirty.add(key); }
    }
    if (!snap.metadata.fromCache && !this.synced[c]) {
      this.synced[c] = true;
      for (const id in this.state[c]) if (!seen.has(id)) this.dirty.add(c + ":" + id);
    }
    if (this.dirty.size) this.flushSoon();
    else if (!this.flushing) this.setStatus(navigator.onLine ? "ok" : "offline");
    if (changed) { this.persistSoon(); App.changed(c, true); }
  },
  onErr(err) {
    if (err && err.code === "revoked") { this.base = null; this.setStatus("local"); }
  },
  flushSoon(ms = 1500) {
    if (!this.base && !this.sb) return;
    clearTimeout(this._fT); this._fT = setTimeout(() => this.flush(), ms);
  },
  async flush() {
    if (this.sb) return this.flushSB();
    if (!this.base || this.flushing) return;
    if (!navigator.onLine) { this.setStatus("offline"); return; }
    if (!this.dirty.size) { this.setStatus("ok"); return; }
    this.flushing = true; this.setStatus("busy");
    try {
      while (this.dirty.size && this.base) {
        const key = this.dirty.values().next().value;
        const i = key.indexOf(":"); const c = key.slice(0, i), id = key.slice(i + 1);
        const rec = c === "meta" ? this.state.meta : this.state[c]?.[id];
        this.dirty.delete(key);
        if (!rec) continue;
        const ref = c === "meta" ? this.base : this.base.collection(c).doc(id);
        try { await ref.set(JSON.parse(JSON.stringify(rec))); }
        catch (e) {
          if (e && e.code === "invalid_argument") {
            if (c === "chapters") toast("Este capítulo es demasiado largo para sincronizarse. Divídelo en dos para que se guarde en la nube.");
            continue; // no se puede reintentar; queda guardado en este dispositivo
          }
          this.dirty.add(key);
          if (e && e.code === "quota_exceeded") toast("Se llenó el espacio de sincronización. Tus cambios siguen guardados en este dispositivo.");
          throw e;
        }
      }
      this.setStatus("ok");
    } catch (e) {
      this.setStatus(navigator.onLine ? "busy" : "offline");
      clearTimeout(this._fT); this._fT = setTimeout(() => this.flush(), 8000);
    } finally {
      this.flushing = false; this.persistSoon();
    }
  },
};
const SYNC_TEXT = { local: "Guardado en este dispositivo", ok: "Sincronizado", busy: "Guardando…", offline: "Sin conexión: se sincroniza al volver" };
window.addEventListener("online", () => Store.flushSoon(200));
window.addEventListener("offline", () => Store.base && Store.setStatus("offline"));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { Store.persist(); Store.flush(); } });
window.addEventListener("pagehide", () => Store.persist());

/* ================= Datos derivados ================= */
const Data = {
  projects() { return Store.list("projects").sort((a, b) => (b.touchedAt || b.updatedAt) - (a.touchedAt || a.updatedAt)); },
  chapters(pid) { return Store.list("chapters").filter((c) => c.projectId === pid).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); },
  ideas(pid) { return Store.list("ideas").filter((i) => (pid === undefined ? true : (i.projectId || null) === pid)).sort((a, b) => b.createdAt - a.createdAt); },
  inbox() { return Store.list("ideas").filter((i) => !i.projectId || !Store.get("projects", i.projectId)).sort((a, b) => b.createdAt - a.createdAt); },
  words(pid) { return this.chapters(pid).reduce((s, c) => s + (c.words || 0), 0); },
  current() {
    const m = Store.meta(); const ps = this.projects();
    return (m.currentProjectId && Store.get("projects", m.currentProjectId)) || ps[0] || null;
  },
  lastChapter(pid) {
    const cs = this.chapters(pid); if (!cs.length) return null;
    return cs.slice().sort((a, b) => (b.writtenAt || 0) - (a.writtenAt || 0))[0].writtenAt ? cs.slice().sort((a, b) => (b.writtenAt || 0) - (a.writtenAt || 0))[0] : (cs.find((c) => c.status !== "final") || cs[0]);
  },
  isCuento(p) { return p && p.kind === "cuento"; },
  unitName(p, plural) { return this.isCuento(p) ? (plural ? "Secciones" : "Sección") : (plural ? "Capítulos" : "Capítulo"); },
  week() {
    const stats = Store.meta().stats || {};
    const now = new Date(); const dow = (now.getDay() + 6) % 7; // lunes = 0
    const days = [];
    for (let i = 0; i < 7; i++) { const d = new Date(now); d.setDate(now.getDate() - dow + i); const k = dayKey(d); days.push({ k, w: stats[k] || 0, today: i === dow, future: i > dow }); }
    return days;
  },
  addWords(n) {
    if (n <= 0) return;
    const k = dayKey(); const stats = { ...(Store.meta().stats || {}) };
    stats[k] = (stats[k] || 0) + n;
    const keys = Object.keys(stats).sort(); while (keys.length > 400) delete stats[keys.shift()];
    Store.setMeta({ stats }, { quiet: true });
  },
  rescue() {
    const old = Store.list("ideas").filter((i) => Date.now() - (i.updatedAt || 0) > 5 * 864e5 && (i.text || "").trim().length > 8);
    if (!old.length) return null;
    const seed = Number(dayKey().replace(/-/g, "")); return old[seed % old.length];
  },
};

/* ================= Componentes ================= */
function coverHTML(p, cls = "") {
  const g = GENRES[p.genre] || GENRES.realista;
  const style = `--c1:${g.cover[0]};--c2:${g.cover[1]};--c3:${g.cover[2]}`;
  if (p.cover) return `<div class="cover ${cls}" style="${style}"><img src="${p.cover}" alt="Portada de ${esc(p.title)}"></div>`;
  return `<div class="cover ${cls}" style="${style}" role="img" aria-label="Portada de ${esc(p.title)}"><div class="gen"><span class="orn">${g.orn}</span><div><div class="ttl">${esc(p.title || "Sin título")}</div><div class="rule"></div></div></div></div>`;
}
function progressHTML(p) {
  const cs = Data.chapters(p.id); const n = cs.length || 1;
  const cnt = { final: 0, revision: 0, borrador: 0, pendiente: 0 };
  cs.forEach((c) => (cnt[c.status || "pendiente"] = (cnt[c.status || "pendiente"] || 0) + 1));
  if (!cs.length) return `<div class="progress"><div class="bar"></div><div class="legend"><span>Aún no hay ${Data.unitName(p, true).toLowerCase()}. Crea el primero cuando quieras.</span></div></div>`;
  const seg = ["final", "revision", "borrador", "pendiente"].map((s) => cnt[s] ? `<span class="st-${s}" style="width:${(cnt[s] / n) * 100}%" title="${STATUS[s]}: ${cnt[s]}"></span>` : "").join("");
  return `<div class="progress"><div class="bar">${seg}</div><div class="legend"><span><b>${fmt(Data.words(p.id))}</b> palabras</span><span><b>${cnt.final}</b> de ${cs.length} ${Data.unitName(p, true).toLowerCase()} terminados</span>${cnt.borrador ? `<span><b>${cnt.borrador}</b> en borrador</span>` : ""}</div></div>`;
}
function typeChips(name, sel) {
  return `<div class="chips" role="group" aria-label="Tipo de idea">${Object.entries(TYPES).map(([k, t]) => `<button type="button" class="chip" data-chip="${name}" data-v="${k}" aria-pressed="${k === sel}" title="${t.hint}"><span class="g">${t.g}</span>${t.label}</button>`).join("")}</div>`;
}
function projectChips(name, sel) {
  const ps = Data.projects();
  return `<div class="chips" role="group" aria-label="Libro">${ps.map((p) => `<button type="button" class="chip" data-genre="${p.genre}" data-chip="${name}" data-v="${p.id}" aria-pressed="${p.id === sel}"><span class="dot"></span>${esc(p.title)}</button>`).join("")}<button type="button" class="chip" data-chip="${name}" data-v="" aria-pressed="${!sel}">${ico("inbox")} Sin libro aún</button></div>`;
}
function projectOptions(sel, empty = "Sin libro (queda en la Bandeja)") {
  return `<option value="">${empty}</option>` + Data.projects().map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.title)}</option>`).join("");
}
function ideaCard(i, { showProject } = {}) {
  const t = TYPES[i.type] || TYPES.chispa; const p = i.projectId && Store.get("projects", i.projectId); const ch = i.chapterId && Store.get("chapters", i.chapterId);
  return `<a class="idea ${i.type}" href="#/i/${i.id}" ${p ? `data-genre="${p.genre}"` : ""}>
    <div class="k"><span class="g">${t.g}</span>${t.label}<span class="when">${ago(i.createdAt)}</span></div>
    <div class="tx">${esc(i.text || "(vacía)")}</div>
    ${(showProject && p) || ch || i.origin || (i.characterIds || []).length ? `<div class="ft">${(i.characterIds || []).map((id) => Store.get("characters", id)).filter(Boolean).map((c) => `<span class="pill">${avatarHTML(c, 16)}${esc(c.name)}</span>`).join("")}${showProject && p ? `<span class="pill"><i style="background:var(--accent)"></i>${esc(p.title)}</span>` : ""}${ch ? `<span class="pill">${esc(ch.title)}</span>` : ""}${i.origin ? `<span class="pill">Nació como ${TYPES[i.origin.type]?.label || "idea"}</span>` : ""}</div>` : ""}
  </a>`;
}

    return { genre: "tinta", html: `
      <div class="empty" style="padding-top:12vh">

      </div>` };

          <button class="btn" data-act="capture" data-p="${p.id}">${ico("bulb")} Anotar idea</button>
          <a class="btn ghost" href="#/p/${p.id}">Ver libro</a>
        </div>
      </div>
    </section>
    <div class="home-grid">
      <div class="card">
        <h3>Tu semana</h3>
        <div class="week">${week.map((d, i) => `<div class="d ${d.w ? "on" : ""} ${d.today ? "today" : ""}"><i title="${d.w ? fmt(d.w) + " palabras" : ""}">${d.w ? "✓" : ""}</i>${letters[i]}</div>`).join("")}</div>
        <p class="muted" style="margin:0">${weekMsg}${weekWords ? ` Llevas ${fmt(weekWords)} palabras en total.` : ""}</p>

Views.project = (id, tab = "capitulos") => {
  const p = Store.get("projects", id);

  const unitP = Data.unitName(p, true);

    const cs = Data.chapters(p.id);

            ${c.target ? `<div class="mini"><span style="width:${pct}%"></span></div>` : ""}
          </a>
          <div class="ord"><button class="icon-btn" data-act="move-ch" data-id="${c.id}" data-d="-1" aria-label="Subir" ${i === 0 ? "disabled" : ""}>${ico("up")}</button><button class="icon-btn" data-act="move-ch" data-id="${c.id}" data-d="1" aria-label="Bajar" ${i === cs.length - 1 ? "disabled" : ""}>${ico("down")}</button></div>
        </div>`;
      }).join("")}</div>
      <div class="row" style="margin-top:16px"><button class="btn" data-act="new-chapter" data-p="${p.id}">${ico("plus")} ${Data.isCuento(p) ? "Nueva sección" : "Nuevo capítulo"}</button></div>`;
  } else if (tab === "ideas") {

    if (f.type) ideas = ideas.filter((i) => i.type === f.type);
    if (f.q) { const q = f.q.toLowerCase(); ideas = ideas.filter((i) => (i.text || "").toLowerCase().includes(q)); }
    body = `<div class="toolbar">
        <input class="input" type="search" placeholder="Buscar en las ideas" value="${esc(f.q)}" data-act="idea-search" aria-label="Buscar ideas">
        <div class="chips"><button class="chip" data-act="idea-filter" data-v="" aria-pressed="${!f.type}">Todas</button>${Object.entries(TYPES).map(([k, t]) => `<button class="chip" data-act="idea-filter" data-v="${k}" aria-pressed="${f.type === k}"><span class="g">${t.g}</span>${t.label}${counts[k] ? ` ${counts[k]}` : ""}</button>`).join("")}</div>
        <span class="spacer"></span>
        <button class="btn primary small" data-act="capture" data-p="${p.id}">${ico("plus")} Nueva idea</button>
      </div>
      ${ideas.length ? `<div class="ideas">${ideas.map((i) => ideaCard(i)).join("")}</div>` : `<div class="empty"><h3>${f.type || f.q ? "Nada por aquí" : "Este libro aún no tiene ideas"}</h3><p>${f.type || f.q ? "Prueba con otro filtro o búsqueda." : "Frases, escenas, voces de personajes: todo lo que anotes para este libro vivirá aquí."}</p></div>`}`;
  } else if (tab === "personajes") {
    body = castHTML(p);
  } else {
    const others = Data.projects().filter((x) => x.id !== p.id);
    body = `<div class="settings">
      <div class="card"><h3>Portada</h3><p>Se muestra en tu pantalla de inicio. Si no subes una, INK crea una con el color de tu género.</p>
        <div class="cover-edit">${coverHTML(p)}<div class="row">
          <label class="btn small">${ico("image")} ${p.cover ? "Cambiar imagen" : "Subir imagen"}<input type="file" accept="image/*" class="sr" data-act="cover" data-p="${p.id}"></label>
          ${p.cover ? `<button class="btn small ghost" data-act="cover-rm" data-p="${p.id}">Quitar</button>` : ""}</div></div></div>
      <div class="card">
        <div class="field"><label for="pt">Título</label><input id="pt" class="input" value="${esc(p.title)}" data-act="p-field" data-f="title" data-p="${p.id}"></div>
        <div class="meta-grid">
          <div class="field"><label for="pg">Género y atmósfera</label><select id="pg" class="input" data-act="p-field" data-f="genre" data-p="${p.id}">${Object.entries(GENRES).map(([k, x]) => `<option value="${k}" ${k === p.genre ? "selected" : ""}>${x.label}</option>`).join("")}</select></div>
          <div class="field"><label for="pk">Tipo</label><select id="pk" class="input" data-act="p-field" data-f="kind" data-p="${p.id}"><option value="novela" ${p.kind !== "cuento" ? "selected" : ""}>Novela (con capítulos)</option><option value="cuento" ${p.kind === "cuento" ? "selected" : ""}>Cuento (con secciones)</option></select></div>
        </div>
        <div class="field"><label for="pp">Es continuación de</label><select id="pp" class="input" data-act="p-field" data-f="parentId" data-p="${p.id}"><option value="">Ninguno, es una historia nueva</option>${others.map((o) => `<option value="${o.id}" ${o.id === p.parentId ? "selected" : ""}>${esc(o.title)}</option>`).join("")}</select></div>
        <div class="field" style="margin:0"><label for="pd">Sinopsis breve</label><textarea id="pd" class="input" rows="3" data-act="p-field" data-f="synopsis" data-p="${p.id}" placeholder="¿De qué trata, en dos o tres líneas?">${esc(p.synopsis || "")}</textarea></div>
      </div>
      <div class="card"><h3>Eliminar libro</h3><p>Sus ${unitP.toLowerCase()} y personajes se eliminan. Sus ideas no se pierden: pasan a la Bandeja.</p><button class="btn danger" data-act="del-project" data-p="${p.id}">${ico("trash")} Eliminar «${esc(p.title)}»</button></div>
    </div>`;
  }
  return { genre: p.genre, html: `
    <div class="p-head">${coverHTML(p)}<div style="min-width:0"><h1 class="page-title">${esc(p.title)}</h1><div class="sub">${(GENRES[p.genre] || {}).label}, ${Data.isCuento(p) ? "cuento" : "novela"}${parent ? `. Continúa <a href="#/p/${parent.id}">«${esc(parent.title)}»</a>` : ""}</div>${p.synopsis ? `<p class="muted" style="margin:8px 0 0;max-width:60ch">${esc(p.synopsis)}</p>` : ""}</div></div>
    <div class="row" style="margin:-8px 0 18px"><button class="btn small" data-act="book-export" data-p="${p.id}">${ico("download")} Exportar libro en PDF</button></div>
    <nav class="tabs">${tabs.map(([k, l]) => `<a href="#/p/${p.id}/${k}" ${k === tab ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>
    ${body}` };
};

/* ---------- Datos ---------- */
Object.assign(Data, {

    return Store.list("characters").filter((c) => c.projectId === pid).sort((a, b) => (order[a.role] ?? 2) - (order[b.role] ?? 2) || (a.name || "").localeCompare(b.name || "", "es"));

/* ---------- Red de relaciones ---------- */
function graphDims() { const w = $("#view")?.clientWidth || window.innerWidth; return w < 640 ? { W: 600, H: 820, r: 40 } : { W: 1000, H: 600, r: 36 }; }
function nodePos(c, i, n, dims) {
  const pos = c.pos && typeof c.pos.x === "number" ? c.pos : (() => { const a = (i / Math.max(1, n)) * Math.PI * 2 - Math.PI / 2; const rr = n <= 1 ? 0 : 0.34; return { x: 0.5 + Math.cos(a) * rr * (dims.H / dims.W) * 1.1, y: 0.5 + Math.sin(a) * rr }; })();
  const m = dims.r + 26, mx = dims.r + 56;
  return { x: Math.min(dims.W - mx, Math.max(mx, pos.x * dims.W)), y: Math.min(dims.H - m - 18, Math.max(m, pos.y * dims.H)) };
}
function graphHTML(p) {
  const dims = graphDims(); const cs = Data.characters(p.id); const rels = Data.relations(p.id);
  const sel = App.graphSel && Store.get("characters", App.graphSel) ? App.graphSel : null;
  const pts = {}; cs.forEach((c, i) => (pts[c.id] = nodePos(c, i, cs.length, dims)));

  const markers = Object.entries(RELTYPES).filter(([, t]) => t.arrow).map(([k, t]) => `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${t.color}"/></marker>`).join("");
  const conn = App.connectFrom && Store.get("characters", App.connectFrom);
  const selC = sel && Store.get("characters", sel);
  return `
    ${conn ? `<div class="banner">${ico("link")} Toca al personaje que quieres conectar con <b>${esc(conn.name)}</b>. <button class="btn small ghost" data-act="connect-cancel">Cancelar</button></div>` : ""}
    <div class="graph-wrap">

        <defs>${markers}</defs>
        <g id="edges">${edgesSVG(rels, pts, dims, sel)}</g>
        <g id="nodes">${cs.map((c) => nodeSVG(c, pts[c.id], dims, sel, rels)).join("")}</g>
      </svg>
      <div class="legend">${Object.entries(RELTYPES).map(([k, t]) => `<span><i style="border-top:3px ${t.dash ? (t.dash.startsWith("2") ? "dotted" : "dashed") : "solid"} ${t.color}"></i>${t.label}</span>`).join("")}</div>

    <div class="section-h"><h2>Todas las relaciones</h2><span class="muted">${rels.length}</span></div>
    ${rels.length ? `<div class="rel-list">${rels.map((r) => relRow(r)).join("")}</div>` : `<p class="muted">Todavía no hay relaciones. Toca un personaje y luego Conectar, o agrégalas desde su ficha.</p>`}`;
}
function edgesSVG(rels, pts, dims, sel) {
  const groups = {};
  rels.forEach((r) => { const k = [r.a, r.b].sort().join("|"); (groups[k] = groups[k] || []).push(r); });
  return rels.map((r) => {
    const A = pts[r.a], B = pts[r.b]; if (!A || !B) return "";
    const t = RELTYPES[r.type] || RELTYPES.complicado;
    const k = [r.a, r.b].sort().join("|"); const g = groups[k]; const idx = g.indexOf(r);
    const [P0, P1] = r.a < r.b ? [A, B] : [B, A]; // perpendicular estable por pareja
    const dx = P1.x - P0.x, dy = P1.y - P0.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L; const bend = (idx - (g.length - 1) / 2) * 46;
    const cx = (A.x + B.x) / 2 + nx * bend, cy = (A.y + B.y) / 2 + ny * bend;
    const off = dims.r + 7;
    const d1 = Math.hypot(cx - A.x, cy - A.y) || 1, d2 = Math.hypot(B.x - cx, B.y - cy) || 1;
    const x1 = A.x + ((cx - A.x) / d1) * off, y1 = A.y + ((cy - A.y) / d1) * off;
    const x2 = B.x - ((B.x - cx) / d2) * off, y2 = B.y - ((B.y - cy) / d2) * off;
    const on = !sel || r.a === sel || r.b === sel;
    const mx = 0.25 * x1 + 0.5 * cx + 0.25 * x2, my = 0.25 * y1 + 0.5 * cy + 0.25 * y2;
    const lbl = r.note ? r.note.slice(0, 28) + (r.note.length > 28 ? "…" : "") : t.label;
    const path = `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`;
    return `<g class="edge ${on ? "" : "dim"}" data-rel="${r.id}"><path d="${path}" fill="none" stroke="${t.color}" stroke-width="${on && sel ? 4 : 3}" stroke-linecap="round" ${t.dash ? `stroke-dasharray="${t.dash}"` : ""} ${t.arrow ? `marker-end="url(#ar-${r.type})"` : ""}/><path class="hit" d="${path}" fill="none"/>${sel && on ? `<text x="${mx}" y="${my + 5}" text-anchor="middle" class="elabel">${esc(lbl)}</text>` : ""}</g>`;
  }).join("");
}
function shortName(n) { n = String(n || "Sin nombre").trim(); return n.length <= 14 ? n : n.split(/\s+/)[0]; }
function nodeSVG(c, pt, dims, sel, rels) {
  const ring = (ROLES[c.role] || ROLES.secundario).ring; const r = dims.r * (c.role === "protagonista" ? 1.12 : c.role === "mencionado" ? 0.82 : 1);

    ${sel === c.id ? `<circle r="${r + 11}" class="halo"/>` : ""}
    <circle r="${r + 4}" fill="none" stroke="${ring === "transparent" ? "none" : ring}" stroke-width="3"/>
    <circle r="${r}" fill="${c.color || CHAR_COLORS[0]}"/>
    ${c.thumb ? `<clipPath id="cp-${c.id}"><circle r="${r}"/></clipPath><image href="${c.thumb}" x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" clip-path="url(#cp-${c.id})" preserveAspectRatio="xMidYMid slice"/>` : `<text class="ini" dy=".35em" style="font-size:${r * 0.72}px">${esc(initials(c.name))}</text>`}
    <text class="nlabel" y="${r + 24}">${esc(shortName(c.name))}</text></g>`;
}
function relRow(r, fromId) {
  const A = Store.get("characters", r.a), B = Store.get("characters", r.b); const t = RELTYPES[r.type] || RELTYPES.complicado;

}

function mountGraph() {
  const svg = $("#graph"); if (!svg) return;
  const toSvg = (ev) => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  let drag = null;
  svg.addEventListener("pointerdown", (ev) => {
    const g = ev.target.closest("[data-node]");
    if (!g) { const e = ev.target.closest("[data-rel]"); if (e) { const r = Store.get("relations", e.dataset.rel); r && relModal({ rel: r }); } return; }
    ev.preventDefault(); g.setPointerCapture(ev.pointerId);
    const p = toSvg(ev); const cur = App._pts[g.dataset.node];
    drag = { id: g.dataset.node, g, dx: cur.x - p.x, dy: cur.y - p.y, sx: p.x, sy: p.y, moved: false };
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return; const p = toSvg(ev); const D = App._dims; const m = D.r + 26;
    if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 5) drag.moved = true;
    if (!drag.moved) return;
    const mx = D.r + 56; const x = Math.min(D.W - mx, Math.max(mx, p.x + drag.dx)), y = Math.min(D.H - m - 18, Math.max(m, p.y + drag.dy));
    App._pts[drag.id] = { x, y }; drag.g.setAttribute("transform", `translate(${x} ${y})`);
    const pid = App.route.args[0]; $("#edges").innerHTML = edgesSVG(Data.relations(pid), App._pts, D, App.graphSel);
  });
  const end = () => {
    if (!drag) return; const d = drag; drag = null;
    if (d.moved) { const c = Store.get("characters", d.id); const pt = App._pts[d.id]; Store.put("characters", { ...c, pos: { x: pt.x / App._dims.W, y: pt.y / App._dims.H } }, { quiet: true }); return; }
    nodeTap(d.id);
  };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", () => (drag = null));
  svg.addEventListener("keydown", (ev) => { const g = ev.target.closest && ev.target.closest("[data-node]"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); nodeTap(g.dataset.node); } });
}
function nodeTap(id) {

  App.graphSel = App.graphSel === id ? null : id; App.render();
}

  async set(k, v) { const d = await this.db(); return new Promise((res, rej) => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },

const SB = {

  hdr(tok) { const c = this.cfg(); const h = { apikey: c.key, "Content-Type": "application/json" }; const bearer = tok || (/^eyJ/.test(c.key) ? c.key : ""); if (bearer) h.Authorization = "Bearer " + bearer; return h; },
  base() { return this.cfg().url.replace(/\/+$/, ""); },
  normUrl(u) {

    if (!/^https?:\/\//i.test(u) && /\.supabase\.co/i.test(u)) u = "https://" + u;
